spring.application.name=workout-tracker-backend
server.port=8080

# ---------- MySQL (override with environment variables) ----------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/workout_tracker}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Saicharan@9508}

# "update" only adds missing tables/columns. It never drops anything.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---------- Session cookie ----------
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=2h
# Set to true when you serve the app over HTTPS
server.servlet.session.cookie.secure=false